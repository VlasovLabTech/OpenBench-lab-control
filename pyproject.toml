[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vlasovlab-openbench"
version = "0.1.1"
description = "Local, safety-oriented control and data acquisition for electronics lab instruments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<1",
    "typer>=0.15,<1",
    "pillow>=10,<13",
]

[project.optional-dependencies]
hardware = [
    "bleak>=1.1,<4",
    "hidapi>=0.14,<1",
    "python-vxi11>=0.9,<1",
    "pyserial>=3.5,<4",
]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
openbench = "openbench.cli:app"

[project.urls]
Homepage = "https://github.com/VlasovLabTech/OpenBench-lab-control"
Repository = "https://github.com/VlasovLabTech/OpenBench-lab-control.git"
Issues = "https://github.com/VlasovLabTech/OpenBench-lab-control/issues"
Changelog = "https://github.com/VlasovLabTech/OpenBench-lab-control/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbench = ["web/templates/**/*.html", "web/static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = ".openbench/cache/ruff"
extend-exclude = [".openbench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
cache_dir = ".openbench/cache/mypy"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".openbench/cache/pytest"
